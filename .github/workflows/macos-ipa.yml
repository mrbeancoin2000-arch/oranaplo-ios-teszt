name: iOS unsigned IPA (teszt)
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'GitHub macOS build runner'
        required: true
        default: macos-15-intel
        type: choice
        options:
          - macos-15-intel
          - macos-26-intel
          - macos-15
jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Runner details
        run: |
          uname -a
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Dependencies
        run: |
          brew install xcodegen
          # Google iOS client settings already generated on Windows before upload.
          # Do not run configure.py here: absent google_oauth.json would reset to demo ID.
          xcodegen generate --spec project.yml
      - name: Unsigned build
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project OraNaplo.xcodeproj -scheme OraNaplo -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/OraNaplo.app Payload/
          zip -qry OraNaplo-UNSIGNED.ipa Payload
      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OraNaplo-unsigned-ipa
          path: OraNaplo-UNSIGNED.ipa
          retention-days: 7
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            xcodebuild.log
            project.yml
          if-no-files-found: ignore
          retention-days: 7
