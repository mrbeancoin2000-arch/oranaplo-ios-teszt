name: iOS unsigned IPA (teszt)
run-name: OraNaplo CI ${{ inputs.request_id || 'manual' }}
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'GitHub macOS build runner'
        required: true
        default: macos-15-intel
        type: choice
        options:
          - macos-15-intel
          - macos-26-intel
          - macos-15
      request_id:
        description: 'Unique Windows one-button build correlation ID'
        required: false
        default: manual
        type: string
jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Runner details
        run: |
          uname -a
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Dependencies
        run: |
          brew install xcodegen
          # Google iOS client settings already generated on Windows before upload.
          # Do not run configure.py here: absent google_oauth.json would reset to demo ID.
          xcodegen generate --spec project.yml
      - name: Reconstruct test-only public OAuth metadata
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, plistlib, re
          from pathlib import Path
          info=plistlib.loads(Path('ios/Resources/Info.plist').read_bytes())
          src=Path('ios/Sources/AppConfig.swift').read_text(encoding='utf-8')
          match=re.search(r'static let googleBundleID = "([^"]+)"',src)
          if not match: raise SystemExit('Missing generated public Bundle ID')
          Path('google_oauth.json').write_text(json.dumps({
            'ios_client_id':info['GIDClientID'],
            'ios_bundle_id':match.group(1)},indent=2),encoding='utf-8')
          print('Public OAuth metadata prepared for CI tests, no credentials')
          PYCODE
      - name: Prepayment offline tests and Swift runtime
        shell: bash
        run: |
          set -o pipefail
          python3 tools/prepayment_audit.py 2>&1 | tee prepayment-run.log
      - name: Unsigned iOS simulator build with real Apple SDK
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project OraNaplo.xcodeproj -scheme OraNaplo -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-simulator CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild-simulator.log
      - name: Check Google and HealthKit metadata after XcodeGen
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_build_inputs.py 2>&1 | tee build-inputs.txt
      - name: Unsigned build
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project OraNaplo.xcodeproj -scheme OraNaplo -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log
      - name: Normalize unsigned app Info.plist
        shell: bash
        run: |
          set -o pipefail
          python3 tools/fix_built_plist.py build/Build/Products/Debug-iphoneos/OraNaplo.app/Info.plist 2>&1 | tee plist-normalize.txt
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/OraNaplo.app Payload/
          zip -qry OraNaplo-UNSIGNED.ipa Payload
      - name: Verify IPA configuration
        shell: bash
        run: |
          set -o pipefail
          python3 tools/verify_ipa.py OraNaplo-UNSIGNED.ipa 2>&1 | tee ipa-verification.txt
      - name: Upload IPA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-diagnostics
          path: |
            build-inputs.txt
            plist-normalize.txt
            ipa-verification.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OraNaplo-unsigned-ipa
          path: OraNaplo-UNSIGNED.ipa
          retention-days: 7
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            xcodebuild.log
            xcodebuild-simulator.log
            prepayment-run.log
            logs/prepayment_*/RESULT.json
            logs/prepayment_*/JELENTES.html
            logs/prepayment_*/*.log
            project.yml
            build-inputs.txt
            plist-normalize.txt
            ipa-verification.txt
          if-no-files-found: ignore
          retention-days: 7
