name: Prepayment audit + unsigned iOS simulator build
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: macos-15-intel
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Report Xcode environment
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          swiftc --version
      - name: Prepayment test suite (real Swift core runtime)
        shell: bash
        run: |
          set -o pipefail
          python3 tools/prepayment_audit.py 2>&1 | tee prepayment-run.log
      - name: Generate iOS + watchOS companion project
        run: |
          brew install xcodegen
          xcodegen generate --spec project.watch.yml
      - name: Unsigned iOS simulator build with embedded Watch companion
        shell: bash
        run: |
          set -o pipefail
          bash tools/ci_xcode_build.sh simulator
      - name: Unsigned watchOS simulator build (blocking)
        shell: bash
        run: |
          set -o pipefail
          bash tools/ci_xcode_build.sh watch
      - name: Upload test and build logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OraNaplo-061-prepayment-evidence
          path: |
            prepayment-run.log
            xcodebuild-simulator.log
            xcodebuild-watchsimulator.log
            logs/prepayment_*/RESULT.json
            logs/prepayment_*/JELENTES.html
            logs/prepayment_*/*.log
          if-no-files-found: ignore
          retention-days: 14
