name: OraNaplo
options:
  bundleIdPrefix: hu.oranaplo
  deploymentTarget:
    iOS: "18.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.2.0
targets:
  OraNaplo:
    type: application
    platform: iOS
    sources:
      - path: ios/Sources
      - path: ios/Resources
    info:
      path: ios/Resources/Info.plist
    entitlements:
      path: ios/Resources/OraNaplo.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.oranaplo.ios
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: ios/Sources/OraNaplo-Bridging-Header.h
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: GoogleSignIn

schemes:
  OraNaplo:
    build:
      targets:
        OraNaplo: all
    run:
      config: Debug
